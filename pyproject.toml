[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elitefx-engine"
version = "0.1.0"
description = "ELITEFX — Risk & Cost Engine + injini ya kugundua strategy"
requires-python = ">=3.11"
# RCE inahitaji YAML pekee; tabaka la data linahitaji pandas/pyarrow kwa ticks.
# Dependencies za models zitaongezwa pale zitakapojengwa (DOCTRINE §20).
dependencies = [
    "PyYAML>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src", "src.rce", "src.data", "src.backtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
