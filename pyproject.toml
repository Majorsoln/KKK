[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "elitefx-engine"
version = "0.1.0"
description = "ELITEFX — Risk & Cost Engine"
requires-python = ">=3.11"
# RCE inahitaji YAML pekee. Dependencies za injini ya kugundua strategy
# zitaongezwa pale itakapojengwa (DOCTRINE §20), si kabla.
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["src", "src.rce"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::FutureWarning"]
