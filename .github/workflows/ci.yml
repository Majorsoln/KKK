name: CI

# Repo hii ina RCE pekee (DOCTRINE §18). Malango ya awali yalikuwa yakiendesha
# `src.data.cli` na `src.governance.cli` — code hiyo imeondolewa, na malango
# yaliyokuwa yakiitegemea yameondolewa pamoja nayo badala ya kuachwa yakifeli
# kimya. Yatarudi pale injini ya kugundua strategy itakapojengwa.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests za RCE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sakinisha dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q
