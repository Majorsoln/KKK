name: CI

# Milango ya §4.2 ya docs/IMPLEMENTATION_PLAN.md zinazohusu T0 na T1:
#   DF-01  hash check ya L0 kila build
#   DF-02  tests za normalization ya Toleo A/B
#   DF-04  alert: siku ya trading bila data mpya ya broker
#   G1     sentinel ya uvujaji (DF-08) — inakimbia bila storage (`--synthetic`)
#   G2     holdout guard (DF-14) — splitter inasoma config PEKEE
#
# Storage ya research iko NJE ya repo (§9). Runner isipoiona, malango ya DF-01/DF-04
# yanarudisha SKIPPED — hayafelishi build kwa uwongo, na hayapiti kwa uwongo pia:
# ripoti ya kila run inaonyesha ni lipi lilikaguliwa kweli.

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "30 6 * * 1-5"   # DF-04: ukaguzi wa kila siku ya trading (06:30 UTC)
  workflow_dispatch:

env:
  ELITEFX_RESEARCH_ROOT: ${{ vars.ELITEFX_RESEARCH_ROOT }}

jobs:
  tests:
    name: tests za spec (DF-01..DF-04)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: sakinisha dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: pytest
        run: python -m pytest -q

  l0-integrity:
    name: DF-01 — hash check ya partitions za L0
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "."
      - name: verify-l0
        run: python -m src.data.cli verify-l0

  leakage-sentinel:
    name: G1 — sentinel ya uvujaji (DF-08)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "."
      # `--synthetic` haitegemei storage: lango linakimbia kila build, si pale
      # tu data ilipo. Feature ikianza kusoma bar isiyofungwa, build inasimama.
      - name: sentinel
        run: python -m src.data.cli sentinel --synthetic --points 100

  holdout-guard:
    name: G2 — holdout guard + splits kutoka config (DF-14)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "."
      - name: splits
        run: python -m src.data.cli splits --out splits.json
      - name: pakia mpango
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g2-splits
          path: splits.json
          if-no-files-found: ignore

  broker-feed-freshness:
    name: DF-04 — siku ya trading bila data mpya
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && pip install -e "."
      - name: check-freshness
        run: python -m src.data.cli check-freshness --json --out freshness.json
      - name: pakia ripoti
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: df04-freshness
          path: freshness.json
          if-no-files-found: ignore
