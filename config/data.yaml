# ============================================================
#  data.yaml — DATA & FEATURE STANDARD (spec: docs/DATA_FEATURE_STANDARD.md)
#                                       mpango: docs/RESEARCH_PLAN_R0.md
#  PD anabadilisha HAPA — HAKUNA code inayohitajika.
#  Kubadilisha kigezo chochote hapa = dataset_id MPYA (config_hash inabadilika).
# ============================================================

# ---------- MUDA ----------
timezone:
  storage_tz:        "UTC"              # kila kitu kinahifadhiwa UTC
  broker_server_tz:  "Europe/Berlin"    # KUTHIBITISHWA kwa broker, si kudhaniwa
  day_reset_tz:      "Europe/Berlin"    # inalingana na risk.yaml

# ---------- L0: CHANZO (imesahihishwa kwa data halisi — PD 2026-08-04) ----------
source:
  base_granularity:  "tick"             # ticks bid+ask; bars zote 7 zinajengwa kutoka hapa
  require_bid_ask:   true               # mid pekee HAIRUHUSIWI (spread ni malighafi ya RCE)
  min_years:         10                 # data halisi: 2016-01 -> 2026-04
  symbols:           [EURUSD, GBPUSD, USDJPY, USDCHF, USDCAD, AUDUSD, NZDUSD,
                      EURGBP, EURJPY, EURCHF, GBPJPY, XAUUSD]   # zote 12 kwa UTAFITI/pooling;
                                        # symbols za TRADING ni uamuzi wa RCE (risk.yaml)
  schema_variants:                      # spec §2.1 — L1 inanormalize kuwa schema MOJA
    A: {cols: [timestamp, bid, ask, bid_vol, ask_vol], precision: us}
    B: {cols: [ts, bid, ask, bid_volume, ask_volume], precision: ms,
        symbols: [EURCHF, GBPJPY, XAUUSD]}
  provenance:        "aggregator"       # spec §2.2 — attestation ya gharama inahitaji broker feed
  record_broker_feed: true              # ANZA SASA; partitions mpya zina provenance: broker
  immutable:         true               # append-only + SHA256 kwa kila partition

# ---------- STORAGE YA RESEARCH (spec §9 — `research/` NDANI ya repo; data haipushwi) ----------
# PD 2026-08-04: research_root inaelekezwa `<repo>/research`. `research/data/` iko kwenye
# .gitignore (lango G11). Diski ikijaa (L1+ zinahitaji zaidi ya L0), badilisha env HII PEKEE —
# reports/src zinabaki kwenye repo, data inahamia diski nyingine bila kugusa code.
storage:
  research_root:  "${ELITEFX_RESEARCH_ROOT}"                 # mf. C:\Users\Hp\project\elitefx-engine\research
  l0_root:        "${ELITEFX_RESEARCH_ROOT}/data/L0_raw"     # partitions za L0 (immutable)
  l0_manifest:    "${ELITEFX_RESEARCH_ROOT}/data/L0_raw/manifest_l0.json"   # SHA256 + provenance
  holdout_root:   "${ELITEFX_HOLDOUT_ROOT}"                  # G2: ruhusa ya R8 pekee (§4.3, T1)

# ---------- RECORDER WA FEED YA BROKER (spec §2.2 sharti 1; DF-03, DF-04) ----------
recorder:
  enabled:               true          # inaanza SASA; haiishii (§2.2)
  provenance_tag:        "broker"      # partitions mpya zinatofautishwa na za aggregator
  broker_id:             "Dukascopy-demo-mt5-1"            # LAZIMA (spec §2.2): kitambulisho cha broker/server
                                        # mf. "exness-demo". Kikibadilika baada ya kurekodi,
                                        # recorder INASIMAMA — data ya brokers wawili
                                        # haichanganywi chini ya tag moja.
  source:                "mt5"
  symbols:               []            # tupu = symbols zote za `source.symbols`
  poll_seconds:          60            # mzunguko wa kuvuta ticks
  day_lag_minutes:       15            # subiri baada ya siku ya UTC kufungwa kabla ya kuandika
  initial_backfill_days: 3             # kuanzia lini pale recorder inapoanza mara ya kwanza
  compression:           "zstd"
  calendar:
    holidays_md:         ["01-01", "12-25"]   # kalenda KAMILI inatoka kwenye data (T1)
  freshness_alert:
    grace_hours:         26            # siku ya trading bila data baada ya hii -> ONYO (DF-04)
  mt5:                                  # sifa za kuingia zinatoka ENVIRONMENT, si config
    symbol_suffix:       ""            # mf. ".raw" kwa baadhi ya brokers
    timeout_ms:          15000         # MT5 default ni 60s kimya; hii inafelisha mapema na sababu
    login_env:           "ELITEFX_MT5_LOGIN"
    password_env:        "ELITEFX_MT5_PASSWORD"
    server_env:          "ELITEFX_MT5_SERVER"
    terminal_path_env:   "ELITEFX_MT5_TERMINAL"

# ---------- L1: MALANGO YA UBORA (spec §3) ----------
quality:
  min_coverage:        0.995            # bars zilizopo / zinazotarajiwa (kalenda ya session)
  max_gap_bars:        3                # gap ndani ya session, bars za M1
  max_flat_bars:       10               # mfululizo wa high==low -> stale feed
  max_plausible_spread_pips:            # kikomo cha akili timamu, si cha trading
    default:   50.0
    XAUUSD:   200.0
  fail_action:         "exclude"        # partition iliyofeli HAIINGII L2

# ---------- L2: BARS ----------
bars:
  timeframes:        [D1, H4, H2, H1, M30, M15, M5]
  build_from:        "tick"             # ticks -> M1 ya ndani -> TF 7; SI kupakua kutoka broker
  per_bar_stats:     [spread_mean, spread_p50, spread_p95, spread_max, n_ticks, n_m1_bars]
  decision_tf:       "H1"               # as-of anchor (spec §4.1)
  leakage_sentinel:  true               # test ya lazima kwa kila build

# ---------- L3: FEATURES ----------
features:
  normalization:       "rolling"        # rolling/expanding TU — global mean/std ni uvujaji
  norm_window:         500              # bars za TF husika
  labels_per_feature:  50               # bajeti: labels / features >= hii (spec §0.1)
  min_coverage:        0.95             # decision points zenye thamani halali
  nan_policy:          "invalidate"     # hakuna imputation ya kubuni
  families:            [F1, F2, F3, F4, F5, F6, F7]
  training_mode:       "pooled"         # symbols zote pamoja; per-symbol ni calibration pekee

# ---------- L4: LABELS (spec §5) ----------
labels:
  horizon_bars:        24               # bars za H1
  resolve_on:          "tick"           # touch order inatatuliwa kwa TICKS (spec §5) — si OHLC
  touch_side:          "trade_price"    # BUY: SL/TP kwa bid · SELL: kwa ask (spread imo ndani)
  gap_honest:          true             # stop = touch, si close
  quantile:
    quantiles:         [0.10, 0.50, 0.90]
    units:             "atr"            # SI pips (hoja ya S3)
  barrier:
    sl_atr:            [0.5, 0.75, 1.0, 1.5, 2.0]   # GRID = input ya model, si derived (anti-S1)
    tp_atr:            [0.5, 1.0, 1.5, 2.0, 3.0]
    timeout_class:     true             # darasa la tatu, halitupwi kimya
    timeout_record_return: true         # terminal return ya timeout -> E[R|timeout] (EV madarasa 3)
    max_timeout_frac:  0.35
    min_labels_per_cell: 200
  fill:
    order_types:       [market, stop, limit]
    cap_source:        "config/risk.yaml:slippage_cap_pips"   # chanzo KIMOJA
  quality_buckets:                       # L-D kwa XGBoost, R_net
    a_plus:  1.5
    a:       0.8
    b:       0.2                         # chini ya hii -> reject

# ---------- L5: SPLITS (spec §7 + docs/DATA_SPLIT_PLAN.md) ----------
splits:
  scheme:            "purged_kfold"
  folds:             5
  embargo_mult:      1.5                # embargo = horizon_bars x hii (24 x 1.5 = bars 36 za H1)
  holdout_frac:      0.2                # ya mwisho kwa mfuatano wa wakati
  holdout_opens:     "once"             # R8 PEKEE
  random_split:      false              # kamwe
  # --- MIPAKA HALISI (PD 2026-08-04; data ya ticks 2016-01-04 -> 2026-04-30) ---
  data_start:        "2016-01-04"       # mwanzo wa pamoja kwa symbols zote
  data_end:          "2026-04-30"       # mwisho wa pamoja (Toleo A); Toleo B inakatwa hapa
  trainval_end:      "2024-03-31"       # miezi 99 (~80%) — TRAIN+VALIDATION
  holdout_start:     "2024-04-01"       # miezi 25 (~20%) — HAIFUNGULIWI hadi R8
  fold_boundaries:                      # blocks 5 za muda, symbols ZOTE fold ile ile (pooled)
    - "2017-08-31"                      # F1: 2016-01-04 -> 2017-08-31
    - "2019-04-30"                      # F2: 2017-09-01 -> 2019-04-30
    - "2020-12-31"                      # F3: 2019-05-01 -> 2020-12-31
    - "2022-08-31"                      # F4: 2021-01-01 -> 2022-08-31
                                        # F5: 2022-09-01 -> 2024-03-31
  future_reserve:    "2026-05-01+"      # data mpya (Mei 2026+) — mzunguko UJAO / shadow; haionwi sasa

# ---------- VIZINGITI VYA UTAFITI (RESEARCH_PLAN_R0) ----------
research:
  screening:                            # R2
    ic_min:             0.02            # pooled pekee (~38k labels, SE~0.005); per-symbol = kelele
    ic_sign_stability:  0.60
    permutation_test:   true            # feature isiyoshinda toleo lake la bahati -> LESSON
    fdr_method:         "benjamini_hochberg"   # multiple testing kwa candidates ~770
    fdr_q:              0.10
  redundancy:                           # R3
    corr_cluster:       0.80
    method:             "hierarchical"
  calibration:                          # R5
    ece_max:            0.05
    brier_skill_min:    0.0             # dhidi ya base rate
    method:             "isotonic"      # inajifunza kwenye validation fold PEKEE
  ev:                                   # R6 — EV ya MADARASA 3 (§2.1 ya KAIROS-1)
    classes:            3               # p_tp / p_sl / p_timeout
    timeout_ev_source:  "empirical_per_cell"   # kutoka timeout labels; SI quantile head (anti-S1)
    cost_stress_mult:   1.5             # EV_R lazima ibaki chanya kwa cost x hii
    fill_rate_min:      0.60            # inalingana na config/risk.yaml
  holdout:                              # R8
    degradation_max:    0.25            # (EV_R_val - EV_R_holdout) / EV_R_val
  pre_registration:     true            # vigezo vinaandikwa KABLA ya kuona namba

# ---------- PRETRAINING (KAIROS-1 §5A) ----------
pretraining:
  enabled:            true
  corpus_end:         "2024-03-31"      # = trainval_end; kupretrain kwenye HOLDOUT = uvujaji
  objectives:         [next_bar_direction, masked_bar, contrastive_regime]
  fine_tune:          "heads_only"      # encoder ganda/nusu-ganda; heads kwenye trade labels
  gate:               "R4_baseline"     # model iliyopretrainiwa inashindana kama kila mtu

# ---------- R9: LIVE MONITORING (vigezo vya kustaafu — pre-registered) ----------
monitoring:
  min_live_trades:      100             # kabla ya hukumu yoyote ya live
  live_ece_mult_max:    2.0             # rolling ECE ya live > 2x ya validation -> simamisha
  live_ev_frac_min:     0.50            # EV_R ya live < nusu ya attestation -> simamisha
  psi_max:              0.25            # drift ya features (PSI) kwa kudumu -> simamisha
  reattest_cadence:     "quarterly"     # au trigger yoyote hapo juu — kipi kitangulie
  shadow_required:      true            # demo/paper kabla ya pesa halisi
