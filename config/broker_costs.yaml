# ============================================================
#  broker_costs.yaml — gharama za BROKER (spec: docs/RISK_COST_ENGINE.md §3.3)
#  PD anahariri HAPA. Vigezo vya risk viko config/risk.yaml.
#
#  Commission ndiyo kitu pekee MT5 haitoi kwa uhakika. Vingine
#  (volume_min/step/max, swap_long/short/mode, contract_size, point)
#  vinatoka MT5 wakati wa runtime — spec §3.4 na §4.
# ============================================================

# Thamani ni ya PANDE MBILI (round-turn) — spec §3.3: broker akitoa bei ya
# upande mmoja, IONGEZWE MARADUFU kabla ya kuandikwa hapa.
#
# ---------------------------------------------------------------------------
# HALI: IMEPIMWA (2026-09-10, DOCTRINE §13.10)
#
# `scripts/mt5_commission.py --nakubali --volume 1.0`, demo, deals 22 kutoka
# symbols 11 (XAUUSD ilikuwa MARKET_CLOSED). Ukungu wa kipimo ±$0.01/lot.
#
# **Si jedwali la namba 12. Ni namba MOJA na sheria moja:**
#
#     commission_usd = 7.00 × (bei ya sarafu ya MSINGI kwa dola)
#
# Kipimo (÷ 7.00 kunatoa bei ya sarafu ya msingi, safu ya kulia):
#
#     USDJPY USDCHF USDCAD   7.00   →  1.0000   msingi ni USD
#     EURUSD                 8.12   →  1.1600   = EURUSD
#     EURCHF EURJPY          8.13   →  1.1614   = EURUSD
#     EURGBP                 8.14   →  1.1629   = EURUSD
#     GBPUSD                 9.46   →  1.3514   = GBPUSD
#     GBPJPY                 9.47   →  1.3529   = GBPUSD
#     AUDUSD                 5.02   →  0.7171   = AUDUSD
#     NZDUSD                 4.06   →  0.5800   = NZDUSD
#
# Broker anatoza $3.50 kwa upande kwa lot, kwa sarafu ya msingi. Namba
# zilizo hapa chini ni **rejea ya kipimo** kwa bei ya siku hiyo; hesabu
# HAIZITUMII. `backtest.driver.commission_usd` inatumia sheria na bei ya
# wakati wa trade, kwa sababu bei inabadilika na namba iliyogandishwa
# ingekuwa imepitwa na wakati mara moja.
#
# `0.01` HAITOSHI kupima hii: MT5 inaandika commission kwa senti, kwa hiyo
# kugawa kwa 0.01 kunatoa ukungu wa $2.00/lot na namba shufwa zote
# (USDJPY ilisomeka `6.00` — mviringo, si bei).
#
# HAIJAPIMWA: XAUUSD (soko lilikuwa limefungwa).
# DEMO: inahitaji kuthibitishwa kwenye akaunti halisi kabla ya §10 hatua 5.
# ---------------------------------------------------------------------------
commission_base_round_turn: 7.00      # sarafu ya MSINGI, si USD daima

commission_usd_round_turn:            # rejea ya kipimo 2026-09-10 pekee
  default:  7.00
  EURUSD:   8.12
  GBPUSD:   9.46
  USDJPY:   7.00
  USDCHF:   7.00
  USDCAD:   7.00
  AUDUSD:   5.02
  NZDUSD:   4.06
  EURGBP:   8.14
  EURJPY:   8.13
  EURCHF:   8.13
  GBPJPY:   9.47
  XAUUSD:   7.00                      # HAIJAPIMWA — soko lilikuwa limefungwa

# Usiku zinazotarajiwa kwa kila strategy (spec §3.4 hatua 4).
# Takwimu za strategy, si kudhaniwa — H1 intraday = 0.
expected_nights:
  default:      0.0
  intraday_h1:  0.0
  swing_d1:     3.5

# Ukubwa wa mkataba — unatoka MT5 (`symbol_info.trade_contract_size`).
#
# HALI: IMEPIMWA (2026-09-10, `scripts/mt5_specs.py`, DOCTRINE §13.10).
# Symbols 12 zote zilisomwa kutoka MT5: FX zote 100,000 na XAUUSD 100 —
# sawa kabisa na dhana iliyokuwa hapa. Dhana ilikuwa sahihi; sasa ni kipimo.
contract_size:
  default:  100000
  XAUUSD:   100

# Weka `true` baada ya kulinganisha na MT5. Ikiwa `false`, jedwali la
# Calibration A linaandikwa likiwa na alama ya `contract_size_confirmed: false`.
contract_size_confirmed: true

# Sehemu ya usiku hizo zinazoangukia rollover ya Jumatano->Alhamisi (swap x3).
# 0.2 = mmoja kati ya watano; strategy inayoshikilia wiki nzima ni kubwa zaidi.
triple_night_share:
  default:      0.2
